name: Update Al Mal index

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-almalnews-index.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Al Mal news index
          file_pattern: data/almalnews.json
